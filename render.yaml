# Render blueprint for the Online Pathshala backend (free tier).
# Deploy: Render Dashboard → New → Blueprint → pick this repo.
# The DB_* and JWT_SECRET values are marked `sync: false`, so Render will
# prompt you to enter them in the dashboard (never commit real secrets).
services:
  - type: web
    name: online-pathshala-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: MYSQL_DATABASE
        sync: false
      - key: DB_CA_CERT
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: GROQ_API_KEY
        sync: false
