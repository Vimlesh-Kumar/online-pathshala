# Nixpacks configuration for Online Pathshala Monorepo
# This tells Railway exactly how to build and start your backend service

[phases.setup]
nixPkgs = ["...", "nodejs-24_x"]

[phases.install]
cmds = ["npm install"]

[phases.build]
cmds = ["echo 'Frontend build skipped for backend service'"]

[start]
cmd = "cd backend && npm start"
